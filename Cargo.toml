[package]
name = "devsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[[bin]]
name = "devsync-agent"
path = "src/bin/devsync-agent.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.24"
tar = "0.4"
tokio = { version = "1.49", features = ["full"] }
toml = "0.9"
watchman_client = "0.9.0"
